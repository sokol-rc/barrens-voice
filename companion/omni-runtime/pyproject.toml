[project]
name = "barrens-voice-omnivoice-runtime"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "omnivoice==0.2.1",
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "transformers==5.23.0",
]

[tool.uv]
package = false
environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

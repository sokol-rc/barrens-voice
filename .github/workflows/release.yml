# A tag vX.Y.Z (vX.Y.Z-beta.N: a pre-release, the test channel) makes a GitHub release: the installer,
# the archive the updater installs, and its signed manifest. Every step is a mise task.
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest          # Inno Setup 6 is preinstalled there
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0               # Dictionary.lua's D.REVISION: the last commit that changed it
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d  # v5.2.9
      - run: mise run test
      - run: mise run installer      # dist/: archive, manifest.json, notes.md, uv.exe, BarrensVoice-Setup.exe
        env:
          BV_RELEASE_REPO: ${{ github.repository }}
          BV_UPDATE_PUBLIC_KEY: ${{ vars.BV_UPDATE_PUBLIC_KEY }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}   # a test build's «Что нового»: which tags have a release (release.released_tags)
      - run: mise run sign           # dist/manifest.json.sig
        env:
          BV_UPDATE_PUBLIC_KEY: ${{ vars.BV_UPDATE_PUBLIC_KEY }}
          BV_SIGNING_KEY: ${{ secrets.BV_SIGNING_KEY }}
      - name: GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" $flags --title "Barrens Voice ${GITHUB_REF_NAME#v}" --notes-file dist/notes.md \
            dist/BarrensVoice-Setup.exe dist/barrens-voice-*.zip dist/manifest.json dist/manifest.json.sig
      # Clients up to 0.4.0 beta 10 on the test channel take the FIRST release in GitHub's list that has a manifest
      # (not the highest version): another release still carrying one may be taken instead of this one. Only a
      # warning; the latest stable release keeps its manifest (the stable channel reads releases/latest).
      - name: Releases that still offer a manifest
        continue-on-error: true      # only a warning: a failing gh api must not turn a published release red
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || true)
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.draft | not) | select(.tag_name != \"$GITHUB_REF_NAME\" and .tag_name != \"$latest\") | select([.assets[].name] | index(\"manifest.json\")) | .tag_name" |
            while read -r tag; do
              echo "::warning::$tag still has manifest.json: test-channel clients up to beta 10 may take it instead of $GITHUB_REF_NAME"
            done
  # CurseForge and Wago Addons (addon-sites.yml): a release only - test builds reach testers through the launcher's
  # test channel - after the GitHub release its changelog points to. Skipped until the sites' projects exist: the
  # repository's variables CF_PROJECT_ID and WAGO_PROJECT_ID name them. A failed upload goes again by hand:
  # Actions → Addon sites → Run workflow with the tag. No signing key there.
  addon-sites:
    needs: release
    if: ${{ !contains(github.ref_name, '-') && (vars.CF_PROJECT_ID != '' || vars.WAGO_PROJECT_ID != '') }}
    uses: ./.github/workflows/addon-sites.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit

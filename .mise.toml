[tools]
python = "3.13.18"
uv = "0.13.7"
luajit = "2.1.1744318430"

[env]
# uv uses mise's Python instead of downloading its own
UV_PYTHON = { value = "{{ tools.python.path }}", tools = true }

[settings]
# the uv project (pyproject.toml + uv.lock): .venv created by uv when missing and activated
python.uv_venv_auto = "create|source"

[tasks.test]
description = "All tests: Python (with the optional libraries) and Lua"
depends = ["test-py", "test-lua"]

[tasks.test-py]
description = "Python tests; the protocol test runs the addon's encoder with luajit"
run = "uv run --locked python -m unittest discover -s companion/tests"

[tasks.test-lua]
description = "Addon tests on WoW API stubs: windows, payloads, visible-chat filter, Battle.net whispers, «Что нового», dictionary layers; the text functions without stubs"
dir = "addon/BarrensVoice"
run = [
  "luajit ../../companion/tests/ui_mock.lua",
  "luajit ../../companion/tests/bnet_whisper.lua",
  "luajit ../../companion/tests/news.lua",
  "luajit ../../companion/tests/dictionary_layers.lua",
  "luajit ../../companion/tests/text.lua",
]

[tasks.icon]
description = "Redraw the addon icon (Icon.tga), the launcher icon (icon.ico), tools/icon_preview.png and the sites' logo"
run = "uv run --locked python tools/make_icon.py"

[tasks.voices-table]
description = "Regenerate companion/bv/game_voices.json (which game files hold each race voice) from the community listfile"
run = "uv run --locked python tools/game_voices.py"

[tasks.build]
description = "Release archive and manifest.json into dist/ (tools/release.py)"
run = "uv run --locked python tools/release.py"

[tasks.sign]
description = "Sign dist/manifest.json (tools/sign.py): BV_SIGNING_KEY or ~/.config/barrens-voice/release-signing.key"
run = "uv run --locked python tools/sign.py sign"

[tasks.dictionary]
description = "dist/dictionary.json + .sig: the default dictionary for the dictionary online (tools/dictionary_json.py)"
run = ["uv run --locked python tools/dictionary_json.py", "uv run --locked python tools/sign.py sign dist/dictionary.json"]

[tasks.installer]
description = "Windows: release archive, uv.exe and dist/BarrensVoice-Setup.exe (tools/installer.py, Inno Setup 6)"
run = "uv run --locked python tools/installer.py"

[tasks.check-tag]
description = "Is a release tag ready to push: its version, news.toml, CHANGELOG.md at the tagged commit (tools/check_tag.py <tag> [<commit>])"
run = "uv run --locked python tools/check_tag.py"

[tasks.addon-sites]
description = "A release's checkout for CurseForge and Wago: Dictionary.lua stamped, the sites' changelog (`mise run addon-sites v0.4.0`, `--dry`: the version in work's, CI)"
run = "uv run --locked python tools/addon_sites.py"

[tasks.stats]
description = "How many use it: each release's installer, archive and manifest downloads on GitHub (tools/stats.py)"
run = "uv run --locked python tools/stats.py"

[tasks.hooks]
description = "Use the repository's git hooks (.githooks: pre-push checks release tags with tools/check_tag.py)"
run = "git config core.hooksPath .githooks"

[tasks.tts-bench]
description = "Replay Russian messages on the Windows CUDA companion and measure latency"
run = "uv run --locked --extra cuda python tools/tts_bench.py"

[tasks.tts-score]
description = "Check benchmark recordings with the companion's Whisper model"
run = "uv run --locked --extra cuda python tools/tts_score.py"
